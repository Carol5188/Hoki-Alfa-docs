// All data below is synthetic. No production API, identifier or third-party resource is used.
const CPData=(()=>{
  const DAY=86400000,END='2026-10-07',START='2026-07-10';
  const dateNum=s=>Date.parse(s+'T00:00:00Z');
  const date=(s,n)=>new Date(dateNum(s)+n*DAY).toISOString().slice(0,10);
  const days=(a,b)=>Math.round((dateNum(b)-dateNum(a))/DAY);
  const hash=(...args)=>{let n=2166136261;for(const ch of args.join('|'))n=Math.imul(n^ch.charCodeAt(0),16777619);return n>>>0;};
  const regions=['ARAB','CIS','SASIA','TR'];
  const giftDefs=[
    {key:'normal',name:'普通礼物',category:'normal',price:500,color:'#2878b5',rule:'实付金币 ÷ 100，现网取整'},
    {key:'event',name:'活动礼物',category:'event',price:1200,color:'#8572c1',rule:'实付金币 ÷ 100，现网取整'},
    {key:'lucky',name:'幸运礼物',category:'lucky',price:520,color:'#bc6599',rule:'floor(实付金币 ÷ 1,000)'},
    {key:'bond',name:'BOND',category:'bond',price:18888,exp:350,color:'#10b981',rule:'+350 / 件 / 关系子单'},
    {key:'cp1',name:'CP 礼物 · Lv1',category:'cp',price:29999,exp:600,required:1,color:'#37ad96',rule:'+600 / 件'},
    {key:'cp10',name:'CP 礼物 · Lv10',category:'cp',price:69999,exp:1750,required:10,color:'#238b81',rule:'+1,750 / 件'},
    {key:'cp20',name:'CP 礼物 · Lv20',category:'cp',price:199999,exp:6000,required:20,color:'#14695f',rule:'+6,000 / 件'},

function retention(S,n){

  return {total:cohort.length,kept};
}

};
function definition(key){const [title,text]=defs[key]||defs.intimacy;openModal(title,'指标口径 · 当前版评审',`<div class="definition"><h3>统计定义</h3><p>${text}</p><h3>范围与时间</h3><p>按当前筛选日期、大区及关系集合统计。业务日为 UTC+3，日期包含开始和结束日。期末档位来自服务端快照；关系 ID / UID 使用精确匹配。</p><h3>数据来源</h3><p>正式接入：关系服务、亲密值流水、钱包/礼物子单、任务实例与奖励流水、权益快照、客户端埋点。当前原型全部为生成的示例数据。</p></div>`,true);}
function definitions(){openModal('CP 看板 · 指标与统计范围','6 个看板 · 关系 / 亲密值 / 礼物 / 任务 / 权益 / 转化',`<div class="definition"><h3>统一范围</h3><p>CP关系粒度；礼物仅看当前CP双方互赠。BOND混合批次按子单归属，不叠加其他亲友消费。日期使用已完成业务日。等级、权益和流水采用服务端事实源。</p><h3>统计层级</h3><dl><dt>关系</dt><dd>relationship_id去重，双方是一段关系；解除后保留历史。</dd><dt>送礼</dt><dd>batch_id用于发送动作，suborder_id用于CP归属金额和件数；发送人UID用于付费人数。</dd><dt>亲密值</dt><dd>ledger_id为流水；source_type用于来源。创建注入、正向成长、衰减、撤销分开。</dd><dt>任务</dt><dd>relationship_id + 周期 + task_code为实例，达成自动到账。</dd><dt>权益</dt><dd>calculated_level、rights_level、effective_rights_level各有独立含义；永久证书独立。</dd></dl><h3>当前筛选</h3><p>期末档位过滤整段关系的区间事件，不代表事件发生时档位。周任务只纳入完整周期。D7/D30采用成熟新建队列，缺分母显示—。</p><h3>待收口</h3><p>PRD v5.14与成长表v3.9的Lv80/Lv100门槛不同，正式配置仍需裁决。本看板直接读等级快照，不自行选一套曲线。普通礼物取整、截止日快照、任务跨时区聚合和跨期退款要由数据/研发确认。</p><h3>数据与权限</h3><p>当前全部为示例，不接生产服务。正式后台只读；关系UID与流水查询、导出需权限和审计，不能通过看板调整金币、亲密值、任务或权益。</p></div>`,true);}
function exportCsv(rows,name){const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"',safe=v=>typeof v==='string'&&/^[=+\-@\t\r]/.test(v)?"'"+v:v;const meta=[['CP示例数据','非线上数据'],['看板',pages.find(p=>p[0]===state.page)[1]],['开始日期',state.filter.start],['结束日期',state.filter.end],['大区',state.filter.region],['期末档位',state.filter.stage],['关系ID/UID',state.filter.query],['礼物分类',state.page==='gifts'?state.giftCat:'不适用'],['任务周期',state.page==='tasks'?(state.daily?'daily':'weekly'):'不适用'],[]];const csv='\ufeff'+[...meta,...rows].map(r=>r.map(v=>quote(safe(v))).join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('当前筛选的完整明细已导出（示例数据）');}
function reset(){state.filter={start:'2026-09-08',end:D.END,region:'all',stage:'all',query:''};state.demo='normal';state.giftCat='all';state.pageNo=1;$('#period').value='30';$('#startDate').value=state.filter.start;$('#endDate').value=state.filter.end;$('#region').value='all';$('#stage').value='all';$('#relationQuery').value='';$('#demoState').value='normal';render();}
$('#filterForm').addEventListener('submit',e=>{e.preventDefault();const start=$('#startDate').value,end=$('#endDate').value;if(start>end){notify('开始日期不能晚于结束日期');$('#startDate').focus();return;}if(start<D.START||end>D.END){notify('示例数据仅覆盖 2026-07-10 至 2026-10-07');return;}state.filter={start,end,region:$('#region').value,stage:$('#stage').value,query:$('#relationQuery').value.trim()};state.pageNo=1;render();});
$('#period').addEventListener('change',()=>{if($('#period').value==='custom')return;$('#endDate').value=D.END;$('#startDate').value=D.date(D.END,1-Number($('#period').value));});
$('#startDate').addEventListener('change',()=>$('#period').value='custom');$('#endDate').addEventListener('change',()=>$('#period').value='custom');$('#resetButton').addEventListener('click',reset);$('#demoState').addEventListener('change',()=>{state.demo=$('#demoState').value;render();});$('#definitionsButton').addEventListener('click',definitions);$('#exportButton').addEventListener('click',()=>exportCsv(state.exportRows,'CP-'+state.page+'-'+state.filter.start+'-'+state.filter.end));$('#closeModal').addEventListener('click',closeModal);$('#closeModalFooter').addEventListener('click',closeModal);$('#modalOverlay').addEventListener('click',e=>{if(e.target===$('#modalOverlay'))closeModal();});
document.addEventListener('keydown',e=>{if(state.modalOpen){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...$('#modalOverlay').querySelectorAll('button,a,input,select,[tabindex="0"]')].filter(el=>!el.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}if((e.key==='Enter'||e.key===' ')&&e.target.hasAttribute('data-chart-date')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-chart-date]');if(!b)return;
  if(b.dataset.page){state.page=b.dataset.page;state.pageNo=1;render();return;}
  if(b.dataset.definition){definition(b.dataset.definition);return;}
  if(b.dataset.overviewChart){state.chart=b.dataset.overviewChart;render();return;}
  if(b.dataset.cycle){state.daily=b.dataset.cycle==='daily';render();return;}
  if(b.dataset.pager){state.pageNo+=Number(b.dataset.pager);render();return;}
  if(b.dataset.relation){relationDetail(b.dataset.relation);return;}
  if(b.dataset.order){orderDetail(b.dataset.order);return;}
  if(b.dataset.source){const list=state.dataset.ledger.filter(l=>l.source===b.dataset.source);openModal(D.nameBySource[b.dataset.source]+' · 流水',`当前范围 ${list.length} 笔 · 展示最近 60 笔`,ledgerTable(list.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60)));return;}
  if(b.dataset.chartDate){const d=b.dataset.chartDate,S=state.dataset,list=S.ledger.filter(l=>l.date===d),orders=S.orders.filter(o=>o.date===d&&(state.page!=='gifts'||state.giftCat==='all'||o.category===state.giftCat));openModal(d+' · 当日明细',`${list.length} 笔亲密值流水 · 下方展示前 60 笔`,`<div class="detail-grid">${detailItem('当日新建 / 解除',S.pairs.filter(r=>r.created===d).length+' / '+S.pairs.filter(r=>r.terminated===d).length)}${detailItem('当日正向成长',fmt(D.sum(list.filter(l=>l.delta>0&&l.source!=='initial'),l=>l.delta))+' 点')}${detailItem('当日亲密值净变动',signed(D.sum(list,l=>l.delta))+' 点')}${detailItem(state.page==='gifts'?'当日净礼物金币 · 当前分类':'当日净礼物金币',fmt(D.sum(orders.filter(o=>o.status==='delivered'),o=>o.coins))+' 金币')}</div>${ledgerTable(list.slice(0,60))}`);return;}
  if(b.dataset.giftCat){state.giftCat=b.dataset.giftCat;state.pageNo=1;render();return;}
  if(b.dataset.region){state.filter.region=b.dataset.region;$('#region').value=b.dataset.region;state.pageNo=1;render();return;}
  if(b.dataset.task){const t=state.dataset.tasks.filter(t=>t.code===b.dataset.task),def=D.taskDefs.find(d=>d.code===b.dataset.task);openModal(def.name+' · 任务实例',`${def.code} · ${t.length} 项 · 展示最近 40 项`,`<div class="summary-note">${def.condition}。奖励 +${def.reward}；双方共享同一个关系任务实例，不提供手动领取。</div><div class="table-wrap"><table class="data-table"><thead><tr><th>关系 ID</th><th>周期起止</th><th>状态</th><th class="num">净奖励</th></tr></thead><tbody>${t.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40).map(t=>`<tr><td>${t.rid}</td><td>${t.start} — ${t.date}</td><td>${({credited:'已自动到账',pending:'目标达成待到账',revoked:'已撤销',not_completed:'未达成'})[t.status]}</td><td class="num">${t.status==='credited'?def.reward:0}</td></tr>`).join('')||emptyCell(4)}</tbody></table></div>`);return;}
  if(b.dataset.exportLedger){const ls=state.dataset.ledger.filter(l=>l.rid===b.dataset.exportLedger);exportCsv([['流水ID','关系ID','业务日','来源','亲密值变动','关联事件','规则版本'],...ls.map(l=>[l.id,l.rid,l.date,D.nameBySource[l.source],l.delta,l.ref,l.rule])],'CP-ledger-'+b.dataset.exportLedger);return;}
  if(b.hasAttribute('data-retry')){state.demo='normal';$('#demoState').value='normal';render();return;}
  if(b.hasAttribute('data-clear'))reset();
});
document.addEventListener('change',e=>{if(e.target.id==='giftCategory'){state.giftCat=e.target.value;state.pageNo=1;render();}if(e.target.id==='relationSort'){state.sort=e.target.value;state.pageNo=1;render();}});
render();
})();
</script>
</body>
