    const newConfigState=()=>({schema:1,revision:0,drafts:[],scheduled:null,logs:[]});

    }
    function showTaskConfigLog(){
      openDialog('任务配置变更记录',configState.logs.length?'<div class="config-log">'+table(['时间','操作人','动作 / 版本','变更前','变更后'],[...configState.logs].reverse().map(l=>[esc(l.time),esc(l.actor),esc(l.action)+'<small>'+esc(l.code)+'</small>',esc(Array.isArray(l.before)?l.before.map(configSummary).join('；'):configSummary(l.before)),esc(Array.isArray(l.after)?l.after.map(configSummary).join('；'):configSummary(l.after))]))+'</div>':'<div class="empty">暂无任务配置变更记录</div>');
    }
    document.addEventListener('submit',e=>{if(e.target.id==='taskEditorForm'){e.preventDefault();saveTaskEditor();}});
    document.addEventListener('change',e=>{
      if(e.target.id==='editorCycle'){fillTaskTemplateOptions();renderEditorTargets();}
      if(e.target.id==='editorTemplate')renderEditorTargets();
      if(e.target.id==='configCycle'){configCycleFilter=e.target.value;render();}
      if(e.target.id==='configType'){configTypeFilter=e.target.value;render();}
    });
    document.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      try{
        if(b.dataset.taskMode){taskMode=b.dataset.taskMode;pageIndex=1;mode='normal';clearTimeout(loadTimer);render();}
        if(b.dataset.taskAdd)openTaskEditor('',b.dataset.taskAdd);
        if(b.dataset.taskEdit)openTaskEditor(b.dataset.taskEdit);
        if(b.dataset.taskToggle)toggleTaskDraft(b.dataset.taskToggle);
        if(b.dataset.taskConfirmToggle){const c=configClone(configPlan(configState).find(c=>c.code===b.dataset.taskConfirmToggle));c.enabled=!c.enabled;commitConfigState(draftConfigState(configState,c,new Date().toISOString()));closeDialog();render();showToast('启停修改已存草稿；发布后下一周期生效');}
        if(b.hasAttribute('data-task-publish'))requestTaskPublish();
        if(b.hasAttribute('data-task-confirm-publish')){commitConfigState(publishConfigState(configState,new Date().toISOString()));closeDialog();render();showToast('配置已发布至下一周期（本机演示）');}
        if(b.hasAttribute('data-task-log'))showTaskConfigLog();
        if(b.hasAttribute('data-task-reset'))openDialog('重置配置示例','<p>清除当前浏览器内本原型的配置草稿、待生效版本和配置变更记录，恢复初始8项任务。</p><p class="detail-note">任务实例、账本示例和其他项目不受影响。</p>','<button class="btn" data-close>取消</button><button class="btn primary" data-task-confirm-reset>确认重置</button>');
        if(b.hasAttribute('data-task-confirm-reset')){localStorage.removeItem(CONFIG_STORAGE_KEY);configState=newConfigState();configCycleFilter='all';configTypeFilter='all';configStorageNotice='';closeDialog();render();showToast('已恢复初始任务配置示例');}
      }catch(error){showToast(error.message);}
    });


    function exportDialog(){if(!currentCsv.length){showToast('当前没有可导出的匹配记录');return;}openDialog('导出当前筛选结果',`<div class="detail-grid">${item('查询页面',PAGES[page][0])}${item('全部匹配条数',currentCsv.length)}${item('关系类型',selectedType==='all'?'全部关系':TYPES[selectedType])}</div><p class="detail-note">导出全部匹配记录，不限当前页。${page==='overview'?'总览导出下方关系明细；期间指标在页面查看。':''}示例CSV会包含原关系ID、当前筛选条件及查询日期语义；正式导出需服务端权限与审计。</p><label for="exportPurpose">导出用途（写入本页审计）</label><textarea id="exportPurpose" maxlength="120">产品评审</textarea><p id="exportError" class="error-text" role="alert" hidden>请填写导出用途。</p>`,'<button class="btn" data-close>取消</button><button class="btn primary" data-confirm-export>确认导出CSV</button>');}
    function csvValue(v){let str=String(v??'');if(/^[=+@-]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"';}
    function doExport(){const purpose=$('#exportPurpose').value.trim();if(!purpose){$('#exportError').hidden=false;return;}const data=[['Hoki 亲密关系后台 v2.2','全部为示例数据'],['页面',PAGES[page][0]],['筛选',scopeLabel()],['起止日期',filters.start+' / '+filters.end],['日期语义',$('#dateLabel').textContent],['联查关系ID',contextRid||'全部'],['匹配条数',currentCsv.length],['用途',purpose],[],currentHeaders,...currentCsv];const csv='\ufeff'+data.map(row=>row.map(csvValue).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=`Hoki-relationships-${page}-${selectedType}-v2.2.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);addAudit('导出'+PAGES[page][0],currentCsv.length,purpose);closeDialog();showToast(`已导出${currentCsv.length}条匹配示例记录`);}
    function query(){const next={search:$('#searchInput').value.trim().replace(/^(RID|UID)\s*/i,''),region:$('#regionSelect').value,status:$('#relationStatus').value,start:$('#startDate').value,end:$('#endDate').value};if(next.start&&next.end&&next.start>next.end){$('#filterError').textContent='开始日期不能晚于结束日期；已保留上次有效查询结果。';$('#filterError').hidden=false;return;}$('#filterError').hidden=true;filters=next;pageIndex=1;mode='normal';render();addAudit('查询'+PAGES[page][0],currentRows.length);}
    document.addEventListener('click',e=>{
      const target=e.target.closest('button');if(!target)return;
      if(target.dataset.jump){go(target.dataset.jump);return;}
      if(target.dataset.type){selectedType=target.dataset.type;contextRid='';pageIndex=1;mode='normal';render();return;}
      if(target.dataset.typeDrill){selectedType=target.dataset.typeDrill;contextRid='';local.level='all';go('relations');return;}
      if(target.dataset.link){link(target.dataset.link,target.dataset.rid);return;}
      if(target.hasAttribute('data-clear-context')){contextRid='';pageIndex=1;render();return;}
      if(target.hasAttribute('data-close')){closeDialog();return;}
      if(target.hasAttribute('data-confirm-export')){doExport();return;}
      if(target.dataset.page){pageIndex+=target.dataset.page==='next'?1:-1;render();return;}
      if(target.dataset.demo){clearTimeout(loadTimer);mode=target.dataset.demo;render();if(mode==='loading')loadTimer=setTimeout(()=>{mode='normal';render();},1200);return;}
      if(target.hasAttribute('data-retry')){mode='normal';render();showToast('已恢复示例查询');}
    });
    document.addEventListener('change',e=>{if(e.target.dataset.sub){local[e.target.dataset.sub]=e.target.value;pageIndex=1;render();}if(e.target.id==='pageSize'){pageSize=Number(e.target.value);pageIndex=1;render();}});
    $('#filterForm').addEventListener('submit',e=>{e.preventDefault();query();});
    $('#filterForm').addEventListener('reset',()=>{selectedType='all';contextRid='';filters={search:'',region:'all',status:'all',start:'2026-08-01',end:'2026-10-12'};local={source:'all',kind:'all',giftStatus:'all',cycle:'all',taskState:'all',requestKind:'all',requestState:'all',read:'all',level:'all'};pageIndex=1;mode='normal';$('#filterError').hidden=true;render();});
    $('#exportButton').addEventListener('click',exportDialog);$('#refreshButton').addEventListener('click',()=>{query();showToast('已按当前条件重新查询示例数据');});
    $('#detailDialog').addEventListener('click',e=>{if(e.target===$('#detailDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
    render();
  </script>
</body>
</html>
